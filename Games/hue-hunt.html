<style>
  /* ── INTRO: Color Warp ── */
  #hh-intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #020617;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color: #fff;
    cursor: pointer;
    overflow: hidden;
  }
  #hh-intro.fading {
    opacity: 0;
    transform: scale(1.05);
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none;
  }
  #hh-intro.hidden { display: none; }

  /* Streaking stars */
  .warp-stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .warp-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
  }
  .warp-star.streak {
    animation: starStreak 1.2s ease-in forwards;
  }
  @keyframes starStreak {
    0% {
      opacity: 0;
      width: 2px;
      height: 2px;
    }
    20% {
      opacity: 0.8;
    }
    100% {
      opacity: 0;
      width: 120px;
      height: 1px;
      border-radius: 0;
    }
  }

  /* Color bands that rush toward center */
  .warp-bands {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
  }
  .warp-bands.active { opacity: 1; }
  .warp-band {
    position: absolute;
    height: 3px;
    border-radius: 999px;
    opacity: 0;
    filter: blur(1px);
  }
  .warp-band.rush {
    animation: bandRush 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes bandRush {
    0% {
      opacity: 0;
      width: 0;
      left: var(--start-x);
      top: var(--start-y);
      transform: rotate(var(--angle)) scale(1);
    }
    30% {
      opacity: 0.9;
      width: 200px;
    }
    70% {
      opacity: 0.7;
      width: 60px;
    }
    100% {
      opacity: 0;
      width: 0;
      left: 50%;
      top: 50%;
      transform: rotate(var(--angle)) scale(0);
    }
  }

  /* Central flash */
  .warp-flash {
    position: absolute;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(168,85,247,0.3), transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }
  .warp-flash.boom {
    animation: flashBoom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes flashBoom {
    0% { width: 0; height: 0; opacity: 1; }
    50% { width: 600px; height: 600px; opacity: 0.8; }
    100% { width: 2000px; height: 2000px; opacity: 0; }
  }

  /* Title that emerges from flash */
  .warp-title {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #60a5fa, #a855f7, #ec4899, #60a5fa);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: transparent;
    animation: warpTitleSweep 3s linear infinite;
    opacity: 0;
    transform: scale(3);
    transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    z-index: 10;
    padding-bottom: 8px;
    line-height: 1.3;
  }
  .warp-title.visible {
    opacity: 1;
    transform: scale(1);
  }
  @keyframes warpTitleSweep {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .warp-subtitle {
    font-size: 14px;
    color: rgba(200,210,255,0.7);
    font-weight: 500;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease;
    position: relative;
    z-index: 10;
    margin-top: 12px;
  }
  .warp-subtitle.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Mosaic that fades in after title */
  .warp-mosaic {
    width: 80px;
    height: 80px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    padding: 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 12px 36px rgba(168,85,247,0.25);
    position: relative;
    z-index: 10;
    margin-bottom: 24px;
    opacity: 0;
    transform: scale(0) rotate(180deg);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .warp-mosaic.visible {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .warp-mosaic .wm-tile {
    border-radius: 4px;
    transition: background 0.8s ease;
  }

  .intro-skip {
    position: absolute;
    bottom: 40px;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    font-weight: 600;
    animation: skipPulse 2s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes skipPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.5; }
  }

  @media (max-width: 600px) {
    .warp-title { font-size: 40px; }
    .warp-mosaic { width: 64px; height: 64px; }
  }
</style>

  @keyframes tileEntrance {

    -webkit-tap-highlight-color: transparent;

  @keyframes ymfiPulseReveal {

      outline-width: 0px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.3), 0 0 0 rgba(255,255,255,0.0);
      transform: scale(1);
    }
    40%  {
      outline-width: 5px;
      box-shadow:
        0 16px 32px rgba(0,0,0,0.4),
        0 0 0 8px rgba(255,255,255,0.2),
        0 0 40px rgba(255,255,255,0.4);
      transform: scale(1.05);
    }
    100% {
      outline-width: 4px;
      box-shadow:
        0 16px 32px rgba(0,0,0,0.4),
        0 0 0 12px rgba(255,255,255,0.12),
        0 0 36px rgba(255,255,255,0.3);

<!-- INTRO SCRIPT -->
<script>
(function() {
  var intro = document.getElementById('hh-intro');
  var starsContainer = document.getElementById('warpStars');
  var bandsContainer = document.getElementById('warpBands');
  var flash = document.getElementById('warpFlash');
  var mosaic = document.getElementById('warpMosaic');
  var title = document.getElementById('warpTitle');
  var sub = document.getElementById('warpSub');
  var timers = [];
  var starIntervals = [];

  var colors = ['#60a5fa', '#a855f7', '#ec4899', '#4ade80', '#fbbf24', '#8b7cf0', '#f472b6', '#38bdf8', '#fb923c'];
  var bandColors = ['#60a5fa', '#a855f7', '#ec4899', '#4ade80', '#fbbf24', '#8b7cf0'];

  for (var i = 0; i < 9; i++) {
    var tile = document.createElement('div');
    tile.className = 'wm-tile';
    tile.style.background = colors[i];
    mosaic.appendChild(tile);
  }
  var mosaicHue = Math.random() * 360;
  var mosaicInterval = setInterval(function() {
    mosaicHue = (mosaicHue + 30) % 360;
    var tiles = mosaic.querySelectorAll('.wm-tile');
    tiles.forEach(function(t, i) {
      t.style.background = 'hsl(' + ((mosaicHue + i * 40) % 360) + ', 72%, 60%)';
    });
  }, 1200);

  var ended = false;
  function endIntro() {
    if (ended) return;
    ended = true;
    timers.forEach(function(t) { clearTimeout(t); });
    starIntervals.forEach(function(si) { clearInterval(si); });
    clearInterval(mosaicInterval);
    intro.classList.add('fading');
    var splash = document.querySelector('#ymfi-findit-game .splash');
    if (splash) {
      splash.style.transition = 'opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s';
      splash.style.opacity = '1';
      splash.style.transform = 'scale(1)';
    }
    setTimeout(function() {
      intro.classList.add('hidden');
    }, 900);
  }

  requestAnimationFrame(function() {
    var splash = document.querySelector('#ymfi-findit-game .splash');
    if (splash) {
      splash.style.opacity = '0';
      splash.style.transform = 'scale(0.95)';
    }
  });

  function spawnStar() {
    var star = document.createElement('div');
    star.className = 'warp-star';
    var angle = Math.random() * Math.PI * 2;
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    var dist = 50 + Math.random() * 100;
    var x = cx + Math.cos(angle) * dist;
    var y = cy + Math.sin(angle) * dist;
    star.style.left = x + 'px';
    star.style.top = y + 'px';
    star.style.transform = 'rotate(' + (angle * 180 / Math.PI) + 'deg)';
    star.style.transformOrigin = 'left center';
    starsContainer.appendChild(star);
    requestAnimationFrame(function() {
      star.classList.add('streak');
    });
    setTimeout(function() {
      if (star.parentNode) star.parentNode.removeChild(star);
    }, 1300);
  }

  var starInt = setInterval(function() {
    for (var s = 0; s < 3; s++) spawnStar();
  }, 80);
  starIntervals.push(starInt);

  timers.push(setTimeout(function() {
    bandsContainer.classList.add('active');
    for (var b = 0; b < 12; b++) {
      (function(idx) {
        var band = document.createElement('div');
        band.className = 'warp-band';
        band.style.background = bandColors[idx % bandColors.length];
        band.style.boxShadow = '0 0 12px ' + bandColors[idx % bandColors.length];
        var angle = (idx / 12) * 360;
        var rad = angle * Math.PI / 180;
        var startX = 50 + Math.cos(rad) * 50;
        var startY = 50 + Math.sin(rad) * 50;
        band.style.setProperty('--start-x', startX + '%');
        band.style.setProperty('--start-y', startY + '%');
        band.style.setProperty('--angle', angle + 'deg');
        bandsContainer.appendChild(band);
        timers.push(setTimeout(function() {
          band.classList.add('rush');
        }, idx * 60));
      })(b);
    }
  }, 1000));

  timers.push(setTimeout(function() {
    clearInterval(starInt);
    flash.classList.add('boom');
  }, 2200));

  timers.push(setTimeout(function() {
    mosaic.classList.add('visible');
  }, 2500));

  timers.push(setTimeout(function() {
    title.classList.add('visible');
  }, 2700));

  timers.push(setTimeout(function() {
    sub.classList.add('visible');
  }, 3100));

  timers.push(setTimeout(function() {
    endIntro();
  }, 4500));

  intro.addEventListener('click', endIntro);
  document.addEventListener('keydown', function onKey() {
    endIntro();
    document.removeEventListener('keydown', onKey);
  });
})();
</script>

  };

  function lsGet(key) {
    try { return localStorage.getItem(key); } catch(e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, val); } catch(e) {}
  }
  function lsGetJSON(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch(e) { return fallback; }
  }
  function lsSetJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
  }

  // ── ANALYTICS HOOKS (#18) ──
  const gameEvents = {
    _listeners: {},
    on(event, fn) {
      (this._listeners[event] = this._listeners[event] || []).push(fn);
    },
    emit(event, data) {
      (this._listeners[event] || []).forEach(fn => { try { fn(data); } catch(e) {} });
    }
  };
  // Expose for external analytics integration

  let audioCtx = null;
  let soundMuted = lsGet("ymfi_findit_mute_v1") === "1";

  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = "sine", vol = 0.15) {
    if (soundMuted) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  // ── UTILITY ──

  // ── DIFFICULTY (#6) ──
  function calcDifficulty(){
    if (level < 3) gridN = 2; else if (level < 7) gridN = 3; else if (level < 12) gridN = 4;
    else if (level < 18) gridN = 5; else if (level < 25) gridN = 6; else if (level < 33) gridN = 7; else gridN = 8;

    diff = clamp(CONFIG.DIFF_MAX - Math.floor(level * CONFIG.DIFF_DECREASE), CONFIG.DIFF_MIN, CONFIG.DIFF_MAX);

    if (gameMode === "relaxed") {
      timeMax = CONFIG.RELAXED_TIME;

      diff = clamp(diff - CONFIG.EXPERT_DIFF_PENALTY, CONFIG.DIFF_MIN, CONFIG.DIFF_MAX);

    const arrows = { ArrowUp: -gridN, ArrowDown: gridN, ArrowLeft: -1, ArrowRight: 1 };
    const delta = arrows[e.key];
    if (delta === undefined) return;
    e.preventDefault();
    const tiles = Array.from(els.grid.querySelectorAll(".tile"));
    const idx = tiles.indexOf(e.currentTarget);
    if (idx < 0) return;
    const row = Math.floor(idx / gridN);
    const col = idx % gridN;
    let newIdx = idx + delta;
    // Prevent wrapping across rows for left/right
    if (e.key === "ArrowLeft" && col === 0) return;
    if (e.key === "ArrowRight" && col === gridN - 1) return;
    if (newIdx >= 0 && newIdx < tiles.length) tiles[newIdx].focus();

        perf[roundBucket].solveTimeMs += solveMs;
        perf[roundBucket].attemptTimeMs += solveMs;
        perf[roundBucket].wrongClicks += roundWrong;
      }
      streak += 1;
      bestStreak = Math.max(bestStreak, streak);
      const gained = Math.round((CONFIG.BASE_SCORE + level * CONFIG.SCORE_PER_LEVEL) * comboMultiplier());
      score += gained;
      timeLeft = clamp(timeLeft + CONFIG.CORRECT_BONUS_MS, 0, timeMax);

      if (roundWrong === 0) perfectRun += 1; else perfectRun = 0;

      // Sound & haptics
      sfxCorrect();
      buzz(12);

      // Combo milestone sound
      if ([4, 8, 15, 25].includes(streak)) sfxCombo();

      // Speed demon check
      checkSpeedDemon(solveMs);

      showScorePop(gained);
      srAnnounce(`Correct! Plus ${gained} points. Score ${score}. Level ${level + 1}.`);

      e.currentTarget.style.transform = "scale(0.98)";
      setTimeout(() => { e.currentTarget.style.transform = ""; }, 80);

      gameEvents.emit("levelComplete", { level, score, streak, solveMs, bucket: roundBucket });

      level += 1;
      nextLevel(false);
    } else {
      roundWrong += 1;
      perfectRun = 0;
      if (perf[roundBucket]) perf[roundBucket].wrongClicks += 1;
      streak = 0;
      timeLeft = clamp(timeLeft - CONFIG.WRONG_PENALTY_MS, 0, timeMax);
      sfxWrong();
      buzz(30);
      setToast("Not that one. Time penalty.", "bad");
      srAnnounce("Wrong tile. Time penalty.");
      updateHUD();
      gameEvents.emit("wrongPick", { level, bucket: roundBucket });
    }
  }

  function revealCorrectTile(){

  // ── REPORT ──
  function fmtSeconds(ms){ const s = ms / 1000; return `${s.toFixed(2)}s`; }

  function pickFastestSlowest(){
    let any2 = false;
    for (const k of bucketOrder){ if (perf[k] && perf[k].solves >= 2) { any2 = true; break; } }
    const minSolves = any2 ? 2 : 1;
    const solveCandidates = bucketOrder.map(k => ({ k, d: perf[k] })).filter(x => x.d && x.d.solves >= minSolves);
    let fastest = null;
    if (solveCandidates.length){
      solveCandidates.sort((a,b) => (a.d.solveTimeMs / a.d.solves) - (b.d.solveTimeMs / b.d.solves));
      fastest = solveCandidates[0];
    }
    const roundCandidates = bucketOrder.map(k => ({ k, d: perf[k] })).filter(x => x.d && x.d.rounds >= 1 && x.d.attemptTimeMs > 0);
    let slowest = null;
    if (roundCandidates.length){
      roundCandidates.sort((a,b) => (a.d.attemptTimeMs / a.d.rounds) - (b.d.attemptTimeMs / b.d.rounds));
      slowest = roundCandidates[roundCandidates.length - 1];
    }
    return { fastest, slowest, minSolvesUsed: minSolves };
  }

  function pickWorstMisclickRate(){
    const candidates = bucketOrder.map(k => ({ k, d: perf[k] })).filter(x => x.d && x.d.rounds >= 1);
    if (candidates.length === 0) return null;
    candidates.sort((a,b) => (b.d.wrongClicks / b.d.rounds) - (a.d.wrongClicks / a.d.rounds));
    return candidates[0];
  }

  function pickMostSeen(){
    const candidates = bucketOrder.map(k => ({ k, d: perf[k] })).filter(x => x.d && x.d.rounds >= 1);
    if (candidates.length === 0) return null;
    candidates.sort((a,b) => b.d.rounds - a.d.rounds);
    return candidates[0];
  }

  function buildReportText(){
    const { fastest, slowest, minSolvesUsed } = pickFastestSlowest();
    const worstMis = pickWorstMisclickRate();
    const mostSeen = pickMostSeen();
    const anyRounds = bucketOrder.some(k => perf[k] && perf[k].rounds > 0);
    if (!anyRounds){ els.reportWrap.style.display = "none"; return; }
    els.reportWrap.style.display = "";
    const lines = [];
    if (fastest){
      const avg = fastest.d.solveTimeMs / fastest.d.solves;
      lines.push(`Fastest avg solve: <span>${fastest.k}</span> (${fmtSeconds(avg)})`);
    } else { lines.push(`Fastest avg solve: <span>\u2014</span> (need more correct rounds)`); }
    if (slowest){
      const avg = slowest.d.attemptTimeMs / slowest.d.rounds;
      lines.push(`Slowest avg solve: <span>${slowest.k}</span> (${fmtSeconds(avg)})`);
    } else { lines.push(`Slowest avg solve: <span>\u2014</span>`); }
    if (worstMis){
      const rate = worstMis.d.wrongClicks / worstMis.d.rounds;
      lines.push(`Highest misclick rate: <span>${worstMis.k}</span> (${rate.toFixed(2)} wrong/round)`);
    } else { lines.push(`Highest misclick rate: <span>\u2014</span>`); }
    if (mostSeen){ lines.push(`Most seen: <span>${mostSeen.k}</span> (${mostSeen.d.rounds} rounds)`); }
    else { lines.push(`Most seen: <span>\u2014</span>`); }
    const note = (minSolvesUsed === 2)
      ? `<br><span style="font-weight:650; color: rgba(255,255,255,0.78);">Fastest avg uses colors with at least 2 correct rounds. Slowest avg includes the final failed round.</span>`
      : `<br><span style="font-weight:650; color: rgba(255,255,255,0.78);">Slowest avg includes the final failed round.</span>`;
    els.reportText.innerHTML = lines.join("<br>") + note;
  }

  // ── COLOR PATTERN FEEDBACK (#4) ──
  function buildVisionInsight(){
    const totalRounds = bucketOrder.reduce((s, k) => s + (perf[k] ? perf[k].rounds : 0), 0);
    if (totalRounds < 8) { els.visionInsight.style.display = "none"; return; }

    // Calculate accuracy per bucket
    const accuracy = {};
    let bucketsWithData = 0;
    for (const k of bucketOrder) {
      if (perf[k] && perf[k].rounds >= 2) {
        accuracy[k] = perf[k].solves / perf[k].rounds;
        bucketsWithData++;
      }
    }
    if (bucketsWithData < 3) { els.visionInsight.style.display = "none"; return; }

    const avgAccuracy = Object.values(accuracy).reduce((s, v) => s + v, 0) / Object.values(accuracy).length;

    // Identify weakest hue groups
    const rgKeys = ["Red", "Orange", "Yellow-Green", "Green"].filter(k => accuracy[k] !== undefined);
    const byKeys = ["Blue", "Yellow"].filter(k => accuracy[k] !== undefined);
    const otherKeys = ["Cyan", "Purple", "Blue"].filter(k => accuracy[k] !== undefined);

    let rgAvg = rgKeys.length ? rgKeys.reduce((s, k) => s + accuracy[k], 0) / rgKeys.length : avgAccuracy;
    let otherAvg = otherKeys.length ? otherKeys.reduce((s, k) => s + accuracy[k], 0) / otherKeys.length : avgAccuracy;
    let byAvg = byKeys.length ? byKeys.reduce((s, k) => s + accuracy[k], 0) / byKeys.length : avgAccuracy;

    const rgGap = otherAvg - rgAvg;
    const byGap = avgAccuracy - byAvg;

    let insightText = "";

    if (rgGap > 0.15 && rgKeys.length >= 2) {
      const weakest = rgKeys.sort((a, b) => accuracy[a] - accuracy[b]);
      insightText = `You found <span>${weakest[0]}</span> and <span>${weakest[1] || weakest[0]}</span> hues trickier to spot than blues and purples. `;
      insightText += `These warm tones tend to be the toughest for many players. Keep practicing to sharpen your eye!`;
    } else if (byGap > 0.15 && byKeys.length >= 2) {
      insightText = `<span>Blue</span> and <span>yellow</span> hues gave you the most trouble this round. `;
      insightText += `These can be some of the sneakiest differences to catch. Try focusing on brightness as well as color.`;
    }

    if (!insightText) { els.visionInsight.style.display = "none"; return; }

    insightText += `<br><br><span style="font-weight:650; color: rgba(255,255,255,0.78);">This is a fun gameplay observation, not a vision test. Results are affected by screen settings, lighting, and time pressure.</span>`;
    els.visionInsight.style.display = "";
    els.visionText.innerHTML = insightText;
  }

  // ── GAME OVER ──
  function gameOver(){
    const failNow = performance.now();
    const failMs = Math.max(0, failNow - roundStartMs);
    if (perf[roundBucket] && roundStartMs) perf[roundBucket].attemptTimeMs += failMs;

    stopRAF();
    revealCorrectTile();
    running = false;
    paused = false;
    els.pauseOv.classList.remove("on");
    setPlayingClass();
    setButtons();

    // Enhanced game over haptic (#9)
    buzz([100, 50, 100, 50, 200]);
    sfxGameOver();

    const prevBest = Number(lsGet(LS_KEY) || 0);
    const isBest = score > prevBest;
    if (isBest && !isDaily) { lsSet(LS_KEY, String(score)); els.B.textContent = String(score); }

    // Daily best
    if (isDaily) {
      const todaySeed = String(getDailySeed());
      const savedDate = lsGet(LS_DAILY_DATE);
      const savedBest = Number(lsGet(LS_DAILY_BEST) || 0);
      if (savedDate === todaySeed && score > savedBest) lsSet(LS_DAILY_BEST, String(score));
      else if (savedDate !== todaySeed) { lsSet(LS_DAILY_DATE, todaySeed); lsSet(LS_DAILY_BEST, String(score)); }
    }

    els.ovt.textContent = "Sometimes it's hard to find the right one.";
    const modeLabel = isDaily ? "Daily Challenge" : MODES[gameMode]?.label || "Normal";
    els.ovb.textContent = `${modeLabel} \u2022 Final score: ${score} \u2022 Reached level: ${level} \u2022 Best streak: ${bestStreak}`;

    buildReportText();
    buildVisionInsight();
    newAchievements = [];
    buildAchievementDisplay();

    mergeGameStats();

    els.ov.classList.add("on");
    els.ov.setAttribute("aria-hidden","false");

    // Focus management: move focus to modal
    requestAnimationFrame(() => { if (els.again) els.again.focus(); });

    // Animate final score
    animateScore();

    gameEvents.emit("gameOver", { score, level, bestStreak, mode: isDaily ? "daily" : gameMode });
  }

  // ── GAME LOOP ──
  function tick(now){
    stopRAF();
    let last = now;
    const isRelaxed = gameMode === "relaxed" && !isDaily;
    const loop = (t) => {
      raf = requestAnimationFrame(loop);
      if (!running || paused) return;
      const dt = t - last;
      last = t;
      if (!isRelaxed) {
        timeLeft -= dt;
        updateBar(timeLeft / timeMax);
        if (timeLeft <= 0) gameOver();
      } else {
        updateBar(1);
      }
    };
    raf = requestAnimationFrame(loop);
  }

    displayedScore = 0;

      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Global Escape for pause/resume during gameplay
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (els.ov.classList.contains("on")) return; // handled by modal's own listener
      if (els.tutorial.classList.contains("on")) return; // handled by tutorial listener
      if (running && !paused) { pauseGame(); }
      else if (paused) { resumeGame(); }
    }
  });

  // ── INIT ──
  const storedBest = Number(lsGet(LS_KEY) || 0);
  els.B.textContent = String(storedBest);
  patternAssist = (lsGet(LS_ASSIST) === "1");
  soundMuted = (lsGet(LS_MUTE) === "1");
  gameMode = lsGet(LS_MODE) || "normal";
  setAssistUI();
  setMuteUI();
  setDiffMode(gameMode);
  showSplash();
})();
</script>

<!-- Service Worker Registration (#10) -->
<script>
if (false && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
