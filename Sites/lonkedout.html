<title>LonkedOut</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,800;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EEF0EC; --surface:#FFFFFF; --surface2:#F6F7F5; --line:#D6DBD7;
  --ink:#1C262B; --ink2:#4F5D63; --ink3:#7C8A90;
  --accent:#0E6E8C; --accent-ink:#FFFFFF; --accent-soft:#DCEBF0;
  --gold:#A87700; --gold-soft:#F6ECCF;
  --otw:#2E7D32; --otw-soft:#DDEFDB;
  --bad:#B3261E; --bad-soft:#F7DEDC;
  --burn:#D9641E; --dig:#6A4C93;
  --note:#F4F0E2; --note-ink:#4A4020; --note-line:#D8CFA8;
  --shadow:0 1px 2px rgba(20,30,35,.08),0 0 0 1px rgba(20,30,35,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111719; --surface:#1A2226; --surface2:#20292E; --line:#2E3A40;
    --ink:#E6EBEC; --ink2:#A9B5B9; --ink3:#76858B;
    --accent:#4FA9C7; --accent-ink:#0B1417; --accent-soft:#173540;
    --gold:#E3B64A; --gold-soft:#3A3012;
    --otw:#7CCB80; --otw-soft:#1E3A22;
    --bad:#F28B82; --bad-soft:#3F1F1D;
    --burn:#F08A4B; --dig:#B394E0;
    --note:#26251B; --note-ink:#E2D9B4; --note-line:#4B4630;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --ground:#111719; --surface:#1A2226; --surface2:#20292E; --line:#2E3A40;
  --ink:#E6EBEC; --ink2:#A9B5B9; --ink3:#76858B;
  --accent:#4FA9C7; --accent-ink:#0B1417; --accent-soft:#173540;
  --gold:#E3B64A; --gold-soft:#3A3012;
  --otw:#7CCB80; --otw-soft:#1E3A22;
  --bad:#F28B82; --bad-soft:#3F1F1D;
  --burn:#F08A4B; --dig:#B394E0;
  --note:#26251B; --note-ink:#E2D9B4; --note-line:#4B4630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05);
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;padding-bottom:64px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

/* ── top bar ─────────────────────────────── */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1128px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:6px 16px}
.logo{display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--accent);text-decoration:none;white-space:nowrap;background:none;border:0;padding:0}
.logo b{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:4px 4px 4px 10px;padding:0 6px;transform:rotate(-7deg) translateY(2px);font-weight:800;text-decoration:line-through;text-decoration-thickness:2px}
.searchwrap{position:relative;flex:0 1 300px}
.search{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:4px;padding:6px 10px;color:var(--ink2);font-size:13px}
.search input{border:0;background:transparent;color:var(--ink);width:100%;font:inherit;outline:none}
.sresults{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:30;display:none;font-size:13px;max-height:340px;overflow:auto}
.sresults.show{display:block}
.sresults button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;color:var(--ink)}
.sresults button:hover{background:var(--surface2)}
.sresults .sh{padding:6px 10px;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border:0;background:none;color:var(--ink2);font-size:11px;border-bottom:2px solid transparent;min-width:66px}
.tab svg{width:22px;height:22px;fill:currentColor}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab.gold{color:var(--gold)}
.badge{position:absolute;top:2px;right:10px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:0 5px;line-height:16px}

/* ── score strip ─────────────────────────────── */
.strip{background:var(--surface2);border-top:1px solid var(--line)}
.strip-in{max-width:1128px;margin:0 auto;padding:5px 16px;display:flex;gap:16px;align-items:center;font-size:12px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;min-width:150px;flex:1}
.stat .bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.stat .bar i{display:block;height:100%;transition:width .4s}
.stat b{font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.stat.clout .bar i{background:var(--accent)}
.stat.burn .bar i{background:var(--burn)}
.stat.dig .bar i{background:var(--dig)}
.trophy{background:none;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;color:var(--ink2)}

/* ── layout ─────────────────────────────── */
.page{max-width:1128px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:225px minmax(0,1fr) 300px;gap:24px}
.page.wide{grid-template-columns:minmax(0,1fr)}
.page.two{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:960px){.page,.page.two{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-body{padding:14px 16px}
.card h2{font-size:16px;font-weight:600}
.muted{color:var(--ink2);font-size:13px}
.tiny{color:var(--ink3);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1400}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;vertical-align:middle}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.otw{background:var(--otw-soft);color:var(--otw)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;position:relative;cursor:pointer;border:0;padding:0;font-family:inherit}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.otw::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:4px solid var(--otw)}
.avatar.otw::before{content:"#OPENTOWORK";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--otw);color:#fff;font-size:6px;padding:0 4px;border-radius:6px;letter-spacing:.3px;font-weight:800;z-index:1}
.namebtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.namebtn:hover{text-decoration:underline}
.tag{color:var(--accent);background:none;border:0;padding:0;font:inherit;font-weight:600;cursor:pointer}

/* ── exhibit notes ── */
.exhibit{background:var(--note);color:var(--note-ink);border:1px dashed var(--note-line);border-radius:6px;margin:10px 16px 14px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;line-height:1.5}
.exhibit summary{cursor:pointer;padding:7px 10px;list-style:none;display:flex;gap:8px;align-items:center;font-weight:600}
.exhibit summary::-webkit-details-marker{display:none}
.exhibit summary::before{content:"◧";font-size:13px}
.exhibit[open] summary::before{content:"◨"}
.exhibit summary .etag{margin-left:auto;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.exhibit .ex-body{padding:0 10px 10px;border-top:1px dashed var(--note-line);padding-top:8px}
.exhibit p{margin:0 0 6px}
.exhibit a{color:inherit;text-decoration:underline;text-underline-offset:2px;word-break:break-word}
.exhibit .src{opacity:.8;font-size:11px}

/* ── composer ─────────────────────────────── */
textarea,input.txt,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--surface2);color:var(--ink)}
textarea{resize:vertical;min-height:90px}
.meter{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:3px 10px;font-size:12px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ── posts ─────────────────────────────── */
.post{padding:12px 16px 6px}
.post .head{display:flex;gap:10px;align-items:flex-start}
.post .name{font-weight:600;font-size:14px}
.post .headline{color:var(--ink2);font-size:12px;line-height:1.3}
.post .body{white-space:pre-wrap;margin:10px 0 6px;font-size:14px}
.post .body.clamp{max-height:120px;overflow:hidden;position:relative}
.post .body.clamp::after{content:"";position:absolute;inset:auto 0 0;height:40px;background:linear-gradient(transparent,var(--surface))}
.more{background:none;border:0;color:var(--ink2);padding:0;font-weight:600;font-size:13px}
.actions{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin-top:8px;padding-top:4px;position:relative}
.actions button{background:none;border:0;color:var(--ink2);padding:8px 6px;font-weight:600;font-size:13px;border-radius:4px;display:flex;align-items:center;gap:6px}
.actions button:hover{background:var(--surface2)}
.reacts{position:absolute;top:-40px;left:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 8px;display:flex;gap:4px;box-shadow:var(--shadow);z-index:4}
.reacts button{font-size:20px;padding:2px 4px}
.kebab{margin-left:auto;background:none;border:0;color:var(--ink2);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.menu{position:absolute;right:12px;top:24px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:5;min-width:230px;font-size:13px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;color:var(--ink)}
.menu button:hover{background:var(--surface2)}
.social{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;padding:4px 0}
.comment{display:flex;gap:8px;padding:6px 0;font-size:13px}
.comment .bubble{background:var(--surface2);border-radius:0 8px 8px 8px;padding:6px 10px;flex:1}
.comment .bubble b{font-size:12px}
.suppressed{opacity:.45;filter:grayscale(.6)}
.poll{border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.poll button{text-align:left;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:16px;padding:5px 12px;font-weight:600;font-size:13px;position:relative;overflow:hidden}
.poll button i{position:absolute;inset:0;background:var(--accent-soft);z-index:-1}
.poll.voted button{z-index:0}
.sponsored{font-size:11px;color:var(--ink3)}
.selfie{width:100%;max-width:320px;border-radius:8px;display:block;margin-top:8px;border:1px solid var(--line)}

/* ── jobs ─────────────────────────────── */
.job{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.job .co{width:44px;height:44px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:800;color:#fff}
.job .title{font-weight:600;color:var(--accent);font-size:15px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.job .title:hover{text-decoration:underline}
.job .meta{font-size:12px;color:var(--ink2)}
.job .apps{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.job .ghost{display:none;position:absolute;right:12px;top:10px}
.job.reveal .ghost{display:inline-block}
.job.reveal{background:repeating-linear-gradient(135deg,transparent 0 10px,var(--bad-soft) 10px 12px)}
.counter{font-variant-numeric:tabular-nums;font-weight:800;font-size:28px;letter-spacing:-.5px}
.jd{font-size:13px;line-height:1.5}
.jd li{margin:3px 0}

/* ── messages ─────────────────────────────── */
.thread{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.thread:hover{background:var(--surface2)}
.thread .prev{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread.unread .prev,.thread.unread .who{font-weight:600;color:var(--ink)}
.msg{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin:10px 0}
.msg.me{background:var(--accent-soft)}

/* ── notifications ─────────────────────────────── */
.notif{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;animation:drop .3s ease;cursor:pointer}
.notif:hover{background:var(--surface2)}
.notif.new{background:var(--accent-soft)}
@keyframes drop{from{transform:translateY(-6px);opacity:0}}
.notif .t{color:var(--ink3);font-size:11px;margin-left:auto;white-space:nowrap}

/* ── profile / settings ─────────────────────────────── */
.banner{height:90px;background:linear-gradient(120deg,var(--accent) 0%,var(--accent-soft) 100%)}
.profile-top{padding:0 16px 14px;margin-top:-32px}
.profile-top .avatar{width:88px;height:88px;font-size:28px;border:3px solid var(--surface)}
.endorse{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle:checked{background:var(--otw)}
.toggle:checked::after{left:20px}
.setting{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.buried{font-size:11px;color:var(--ink3);margin-top:40px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ── modal / popover ─────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,20,.55);z-index:50;display:none;place-items:center;padding:16px}
.modal-bg.show{display:grid}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;max-height:90vh;overflow:auto}
.modal h2{font-size:20px;margin-bottom:6px}
.modal .x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:10px;color:var(--ink3);opacity:.35}
.modal .x:hover{opacity:1}
.blur-row{display:flex;margin:12px 0}
.blur-row .avatar{filter:blur(5px);margin-right:-8px}
.decline{background:none;border:0;color:var(--ink3);font-size:11px;text-decoration:underline;margin-top:10px}
.price{font-size:12px;color:var(--ink3)}
.pop{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:300px;padding:12px;font-size:13px}
.pop .hl{color:var(--ink2);font-size:12px}

/* ── games / bingo ─────────────────────────────── */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bingo button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface2);border-radius:4px;font-size:10.5px;padding:4px;line-height:1.15;color:var(--ink);text-align:center}
.bingo button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lb{font-size:13px}
.lb div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.guess{display:flex;gap:6px;flex-wrap:wrap}
.guess button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink)}
.qgrid{display:grid;grid-template-columns:repeat(5,44px);gap:3px;margin:10px 0}
.qgrid button{width:44px;height:44px;border:1px solid rgba(0,0,0,.25);border-radius:4px;font-size:22px;color:#111}
.qgrid button.bad{outline:3px solid var(--bad)}
.reel{aspect-ratio:9/14;background:linear-gradient(160deg,var(--accent),#1a1a2a);border-radius:10px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;cursor:pointer}
.reel .cap{font-weight:800;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.reel .prog{position:absolute;top:8px;left:10px;right:10px;height:3px;background:rgba(255,255,255,.3)}
.reel .prog i{display:block;height:100%;background:#fff;width:0;transition:width linear}

/* ── receipts ─────────────────────────────── */
.receipt{padding:14px 16px;border-bottom:1px solid var(--line)}
.receipt h3{font-size:15px;font-weight:600;margin-bottom:4px}
.receipt .stat2{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);margin:4px 0}
.receipt ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--ink2)}
.receipt li{margin:2px 0}

/* ── disclaimer / toast ─────────────────────────────── */
.disc{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:var(--ground);font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:8px 16px;text-align:center;z-index:30;line-height:1.4}
.toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:6px;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.ach{position:fixed;top:70px;right:16px;z-index:60;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);transform:translateX(120%);transition:transform .3s;max-width:300px}
.ach.show{transform:none}
.intro{padding:16px;border-left:4px solid var(--accent)}
.intro h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.intro p{margin:6px 0 0;font-size:14px;color:var(--ink2);max-width:65ch}
@media (max-width:600px){.disc{font-size:10px;padding:5px 10px}body{padding-bottom:80px}.searchwrap{flex:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <button class="logo" onclick="go('feed')" aria-label="LonkedOut home">Lonked<b>Out</b></button>
    <div class="searchwrap"><label class="search"><span>⌕</span><input id="q" placeholder="Search people, jobs, buzzwords…" aria-label="Search" oninput="search(this.value)" onfocus="search(this.value)" autocomplete="off"></label><div class="sresults" id="sres"></div></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <div class="strip"><div class="strip-in" id="strip"></div></div>
</header>

<main id="main"></main>

<div class="modal-bg" id="modalbg" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>
<div id="pop"></div>
<div class="toast" id="toast"></div>
<div class="ach" id="ach"></div>
<div class="disc">⚠︎ LonkedOut is an unofficial, non-commercial parody. It is not affiliated with, endorsed by, or connected to LinkedIn or Microsoft. Nothing here is real, stored, or sent anywhere. Every "exhibit note" links to its sources.</div>

<script>
/* ───────────────────────── sources ───────────────────────── */

let chips_={};
function composer(){
  const chips=[['link','Add external link','-50%'],['poll','Make it a poll','-60%'],['agree','End with "Agree?"','-40%'],['doc','PDF carousel','+35%'],['pod','Engagement pod','+80% then -100%'],['ai','Rewrite with AI','?']];
  return `<div class="card"><div class="card-body">
    <div class="row" style="align-items:flex-start">${avatar(YOU,S.otw?'otw':'')}
      <div style="flex:1"><textarea id="draft" placeholder="Start a post. Or don't — the algorithm has already decided." oninput="updReach()"></textarea></div></div>
    <div class="tools">
      <button class="btn sm" onclick="madlib()">🙏 Announce something</button>
      <button class="btn sm" onclick="selfieModal()">😭 Crying selfie</button>
      <button class="btn sm" onclick="lessonGen()">🧵 Tragedy → lesson</button>
      <button class="btn sm" onclick="cringeMeter()">📈 Cringe-o-meter</button>
    </div>
    <div class="chips" style="margin-top:8px" id="chips">${chips.map(c=>`<button class="chip" data-k="${c[0]}" aria-pressed="${!!chips_[c[0]]}" onclick="chip(this)">${c[1]} <span class="tiny">${c[2]}</span></button>`).join('')}</div>
    <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
      <div style="flex:1"><div class="tiny" style="display:flex;justify-content:space-between"><span>Predicted reach</span><span id="reachN">${S.reach}%</span></div><div class="meter"><i id="reachBar" style="width:${S.reach}%"></i></div></div>
      <button class="btn sm" onclick="toast('Scheduled for 7:14am Tuesday. The algorithm will be asleep.')">Schedule</button>
      <button class="btn primary" onclick="publish()">Post</button>
    </div>
    <div class="tiny" id="reachWhy" style="margin-top:6px">70% of your reach is decided in the first 60–90 minutes. Have you considered posting at 7:14am Tuesday?</div>
  </div>
  ${note('The algorithm lab','exhibit 05',`<p>Toggle the chips and watch reach move. The numbers are the industry folklore — mostly from vendors selling scheduling tools — but the one recurring independent study (van der Blom, 2025) found typical creator views down ~50% YoY. "Rewrite with AI" is real: a Premium feature that adds em dashes and "It's not X. It's Y." to your post, while LinkedIn simultaneously suppresses posts that look like that.</p>`,['vdb','links','polls','tnw'])}
  </div>`;
}
function madlib(){modal(`<h2>Announce something</h2><p class="muted">Humility is mandatory. Fill in the blanks.</p>
  <div class="stack" style="margin-top:10px">
  <select id="ml1"><option>Humbled</option><option>Thrilled</option><option>Honored</option><option>Grateful</option><option>Beyond excited</option><option>Speechless (see below)</option></select>
  <select id="ml2"><option>joined a company</option><option>been laid off</option><option>been named to a list</option><option>finished a 10K</option><option>gotten married</option><option>been rejected 47 times</option><option>finished a book (PDF)</option></select>
  <select id="ml3"><option>the team</option><option>my mentors</option><option>my 4-year-old</option><option>my Uber driver</option><option>the algorithm</option><option>everyone who doubted me</option></select>
  <button class="btn primary" onclick="madlibGo()">Generate</button></div>`)}
function madlibGo(){const a=$('#ml1').value,b=$('#ml2').value,c=$('#ml3').value;closeModal();
  $('#draft').value=`${a} and honored to share that I have ${b}.\n\nThis is not about me.\n\nIt's about ${c}. 🙏\n\nTo everyone who believed in me: thank you.\nTo everyone who didn't: thank you even more.\n\n#Humbled #Gratitude #NewBeginnings`;updReach();bump({dig:-3});toast('Drafted. 12 executives have been pre-tagged.')}
function lessonGen(){const t=rnd(["My dog died","My flight was cancelled","My barista spelled my name wrong","I got divorced","My toddler had a meltdown","I was laid off on my birthday","My dad's funeral was Tuesday"]);const l=rnd(["B2B sales","product-market fit","churn","leadership","cold outreach","quarterly planning"]);
  $('#draft').value=`${t}.\n\nI didn't think I'd post about this.\n\nBut it taught me more about ${l} than any MBA.\n\n1. Pipeline is everything\n2. Follow up. Always.\n3. People remember how you made them feel — like customers\n\nRIP. And remember: your Q4 won't close itself. #${l.replace(/\W/g,'')}`;updReach();bump({dig:-8,clout:4});toast('Drafted. Grief has been converted to reach.')}
function cringeMeter(){const v=($('#draft').value||'');let s=10;const hits=[];[[/humbled|honored|thrilled/i,'humble-brag',15],[/agree\?/i,'"Agree?"',15],[/it's not .+\. it's/i,'"It\'s not X. It\'s Y."',20],[/🧵|👇/,'thread emoji',10],[/\n\n.+\n\n.+\n\n/,'broetry spacing',10],[/#\w+/,'hashtags',5],[/lesson|taught me/i,'lesson-ification',15],[/4:30|5am|cold plunge/i,'hustle',10],[/toddler|4-year-old|uber driver/i,'child/driver oracle',20],[/funeral|died|divorce/i,'grief content',25]].forEach(([re,n,w])=>{if(re.test(v)){s+=w;hits.push(n)}});s=Math.min(100,s);
  modal(`<h2>Cringe-o-meter</h2><div class="counter" style="font-size:48px">${s}<span class="tiny">/100</span></div><div class="meter"><i style="width:${s}%;background:${s>60?'var(--bad)':'var(--accent)'}"></i></div><p class="muted" style="margin-top:8px">${hits.length?'Detected: '+hits.join(', ')+'.':'Nothing detected. This post will get 3 likes.'} ${s>60?'Congratulations: the algorithm loves this and you will be screenshotted to a subreddit.':s>30?'Mid-tier cringe. Add a toddler.':'Too sincere. Try "Rewrite with AI".'}</p><button class="btn primary" onclick="closeModal()">Accept</button>`)}
function chip(b){const k=b.dataset.k;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);chips_[k]=on;
  if(k==='ai'&&on){const d=$('#draft');d.value=rewriteAI(d.value||'I started a new job today.');unlock('rewritten');bump({dig:-3});toast('Rewritten. It is now 31% longer and 100% more suppressible.')}
  if(k==='pod'&&on)bump({dig:-5});updReach();}
function rewriteAI(t){const first=t.split(/[.!\n]/)[0].trim()||'I did a thing';
  return `Most people think ${first.toLowerCase()} is the end.\n\nIt's not.\n\nIt's the beginning.\n\nHere's what nobody tells you 🧵\n\n→ ${first}\n→ Growth happens outside your comfort zone\n→ The journey matters more than the destination\n\nIt's not about the outcome — it's about who you become.\n\nAgree? ♻️ #Growth`;}
function updReach(){let r=100,why=[];const d=$('#draft');const v=d?d.value:'';
  if(chips_.link){r*=.5;why.push('external link (−50%)')}
  if(chips_.poll){r*=.4;why.push('poll (−60%)')}
  if(chips_.agree){r*=.6;why.push('"Agree?" (−40%)')}
  if(chips_.doc){r*=1.35;why.push('PDF carousel (+35%)')}
  if(chips_.pod){r*=1.8;why.push('engagement pod (+80%, until detected)')}
  if(chips_.ai||/It's not\b/.test(v)){r*=.55;why.push('looks like AI (classifier −45%)')}
  if(v.length>400){r*=1.2;why.push('long = dwell (+20%)')}
  if(/http/.test(v)){r*=.5;why.push('URL detected (−50%)')}
  if(!v.trim()){why.push('empty posts outperform 31% of the feed')}
  S.reach=Math.max(1,Math.round(r));const n=$('#reachN'),b=$('#reachBar');if(n){n.textContent=S.reach+'%';b.style.width=Math.min(100,S.reach)+'%'}
  const w=$('#reachWhy');if(w)w.textContent=why.length?'Why: '+why.join(' · ')+'. These numbers are from vendor blogs. So are everyone else\'s.':'70% of your reach is decided in the first 60–90 minutes. Have you considered posting at 7:14am Tuesday?';
  const i=$('#imp');if(i)i.textContent=Math.round(S.reach*12);}
function publish(img){const d=$('#draft');const text=(d&&d.value.trim())||(img?'Layoffs are the hardest part of leadership. This one hit different. 😭 #Vulnerability':'(empty post)');const p=mkPost({genre:'Your post',text,srcs:['vdb','tnw']});p.mine=true;p.img=img;p.likes=chips_.pod?412:3;S.posts.unshift(p);
  GENRE_NOTE['Your post']=`<p>Posted. Predicted reach was ${S.reach}%. ${chips_.pod?'The pod delivered 412 likes in 4 minutes; the March 2026 "authenticity update" flags exactly that pattern, so distribution will be capped shortly.':'You got 3 likes: your mom, a bot, and a recruiter warming you up for a pitch.'}</p>`;
  bump({clout:chips_.pod?12:3,burn:4,dig:-2});unlock('published');chips_={};render();addNotif('Your post is getting noticed! 3 views. Boost it for $49.');toast('Posted. An AI comment will arrive shortly.');
  setTimeout(()=>{if(S.posts[0]===p){p.comments.push({who:rnd(PEOPLE),text:rnd(AI_COMMENTS).replace('{n}','You')});if(S.view==='feed')render()}},2500);}

  <div class="row" style="flex-wrap:wrap;gap:6px"><button class="btn sm" onclick="drawSelfie(1)">More tears</button><button class="btn sm" onclick="drawSelfie(2)">Add hoodie</button><button class="btn sm" onclick="drawSelfie(3)">Add caption</button><button class="btn primary sm" onclick="postSelfie()">Post it</button></div>`);drawSelfie(0)}
let selfieState={tears:2,hoodie:false,cap:false};
function drawSelfie(mode){if(mode===1)selfieState.tears+=2;if(mode===2)selfieState.hoodie=!selfieState.hoodie;if(mode===3)selfieState.cap=!selfieState.cap;if(mode===0)selfieState={tears:2,hoodie:false,cap:false};
  const c=$('#cv');if(!c)return;const x=c.getContext('2d');x.fillStyle='#c9d3d8';x.fillRect(0,0,320,320);
  x.fillStyle='#8aa0ad';x.fillRect(0,200,320,120);
  if(selfieState.hoodie){x.fillStyle='#2b2f3a';x.beginPath();x.ellipse(160,300,130,110,0,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(160,150,105,120,0,0,Math.PI*2);x.fill()}
  x.fillStyle='#e8b894';x.beginPath();x.ellipse(160,160,85,105,0,0,Math.PI*2);x.fill();
  x.fillStyle='#fff';[120,200].forEach(ex=>{x.beginPath();x.ellipse(ex,140,16,10,0,0,Math.PI*2);x.fill()});x.fillStyle='#3b2a20';[120,200].forEach(ex=>{x.beginPath();x.arc(ex,142,6,0,Math.PI*2);x.fill()});
  x.strokeStyle='#3b2a20';x.lineWidth=4;x.beginPath();x.moveTo(100,118);x.lineTo(135,126);x.moveTo(220,118);x.lineTo(185,126);x.stroke();
  x.beginPath();x.arc(160,215,22,Math.PI*1.15,Math.PI*1.85);x.stroke();
  x.fillStyle='#5fb3e6';for(let i=0;i<selfieState.tears;i++){const ex=i%2?200:120;const y=158+((i>>1)*22)%80;x.beginPath();x.ellipse(ex+(i%2?6:-6),y,5,9,0,0,Math.PI*2);x.fill()}
  x.fillStyle='rgba(255,255,255,.85)';x.fillRect(0,280,320,40);x.fillStyle='#222';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(selfieState.cap?'This will be the most vulnerable post I ever make.':'Layoffs are the hardest part of leadership.',160,305)}
function postSelfie(){const c=$('#cv');const img=c.toDataURL();closeModal();go('feed');$('#draft').value='';publish(img);unlock('cried');bump({clout:15,dig:-20});toast('Posted. 12,000 people have screenshotted it to a subreddit.')}

function feed(){
  if(!S.posts.length) for(let i=0;i<5;i++) S.posts.push(mkPost());
  return `<div class="page">${leftRail()}<section>
    <div class="card intro"><h1>Welcome to LonkedOut.</h1><p>A working parody of the professional network everyone has to use and nobody likes. Everything is clickable: names, hashtags, counters, the search bar, the buttons that should not exist. Watch your <b>Clout</b>, <b>Burnout</b>, and <b>Dignity</b> in the strip above, collect trophies, and open the dashed <span class="mono">◧ exhibit notes</span> for the real complaint behind each joke, with sources.</p></div>
    ${composer()}
    <div id="posts">${S.posts.map(postHTML).join('')}</div>
    <div style="text-align:center;margin:8px 0 20px"><button class="btn" onclick="moreSlop()">Load more slop</button> <span class="tiny">(${S.slopCount} generated so far · 81.2% of long posts are likely AI)</span></div>
  </section>${rightRail()}</div>`;
}
function mkPost(t){t=t||rnd(TEMPLATES);const who=t.who===undefined?rnd(PEOPLE):PEOPLE[t.who];S.slopCount++;
  return {id:'p'+Math.random().toString(36).slice(2),t,who,likes:Math.floor(Math.random()*4000)+12,comments:[],reacted:null,suppressed:false,expanded:false,mine:false,voted:false};}
const linkify = s => esc(s).replace(/#(\w+)/g,(m,t)=>`<button class="tag" onclick="hashtag('${t}')">#${t}</button>`);
function postHTML(p){
  const who=p.mine?YOU:p.who;
  return `<article class="card ${p.suppressed?'suppressed':''}" id="${p.id}">
    <div class="post">
      <div class="head" style="position:relative">${avatar(who,p.mine&&S.otw?'otw':'')}<div style="flex:1;min-width:0"><div class="name">${nameBtn(who)} ${p.t.genre==='Humblebrag'||p.t.genre==='Toddler KPI'?'<span class="pill gold">Top Voice</span>':''} ${p.mine?(S.badges.length?'<span class="pill gold">Top Voice</span>':''):'<span class="tiny">· 2nd</span>'} ${!p.mine&&!who._conn?`<button class="tag" style="font-size:12px" onclick="connect(${pidx(who)})">+ Connect</button>`:''}</div><div class="headline">${esc(who[1])}</div><div class="tiny">${p.t.sponsored?'<span class="sponsored">Promoted</span>':`${Math.floor(Math.random()*22)+1}h · 🌐`}</div></div>
        <button class="kebab" aria-label="More options" onclick="kebab('${p.id}',event)">···</button></div>
      <div class="body ${p.expanded||p.mine?'':'clamp'}">${linkify(p.t.text)}</div>
      ${p.img?`<img class="selfie" src="${p.img}" alt="Generated crying selfie">`:''}
      ${!p.expanded&&!p.mine?`<button class="more" onclick="expand('${p.id}')">…see more</button>`:''}
      ${p.t.poll?`<div class="poll ${p.voted?'voted':''}">${p.t.poll.map((o,i)=>{const pct=[41,33,22,4][i];return `<button onclick="vote('${p.id}')">${p.voted?`<i style="width:${pct}%"></i>${o} · ${pct}%`:o}</button>`}).join('')}<div class="tiny">${Math.floor(Math.random()*9000)+300} votes · 6d left</div></div>`:''}
      <div class="social"><button class="tag" style="color:var(--ink2);font-weight:400;font-size:12px" onclick="whoLiked('${p.id}')">👍💡🎉 ${p.likes.toLocaleString()}</button><span>${p.comments.length+Math.floor(p.likes/9)} comments · ${Math.floor(p.likes/20)} reposts</span></div>
      <div class="actions" id="act-${p.id}">
        <button onclick="react('${p.id}','👍')" onmouseenter="reactBar('${p.id}')">${p.reacted?p.reacted+' Reacted':'👍 Like'}</button>
        <button onclick="react('${p.id}',null,true)">💬 Comment</button>
        <button onclick="repost('${p.id}')">♻️ Repost</button>
        <button onclick="share('${p.id}')">➤ Send</button>
      </div>
      ${p.comments.map(c=>`<div class="comment">${avatar(c.who,'sm')}<div class="bubble"><b>${esc(c.who[0])}</b> <span class="tiny">· ${c.who===YOU?'AI-drafted for you':'AI-suggested'}</span><br>${esc(c.text)}</div></div>`).join('')}
    </div>
    ${note(`Genre: ${p.t.genre}`,'exhibit',GENRE_NOTE[p.t.genre]||'',p.t.srcs||[])}
  </article>`;
}
const GENRE_NOTE = {
  "AI slop":`<p>Em dashes, "It's not X. It's Y.", three arrows, a 🧵 with no thread. Originality.ai estimated 54% of long posts were likely AI by late 2024 and 81% by mid-2026; median engagement fell 56% as the feed filled with it. LinkedIn's answer: a "Seems like AI slop" report option and a classifier that quietly <em>suppresses</em> (not removes) generic posts — after shipping the tools that write them.</p>`,
  "Broetry":`<p>One sentence per line, a cliffhanger above the "see more" fold, a moral at the bottom. BuzzFeed News named it in 2017; its inventor admitted it's "spoonfeeding people exactly what they want." It exists because the fold-click counts as dwell time.</p>`,
  "Humblebrag":`<p>"Humbled to announce" is the platform's calling card — performative modesty stapled to a press release, with a dozen executives tagged so the algorithm sees engagement.</p>`,
  "Fake inspirational":`<p>The "homeless man is now my Head of Sales" genre: unverifiable, centers the poster in someone else's hardship, and ends with a hashtag. The 2022 "crying CEO" selfie (a real post about layoffs) is credited with turning cringe into a backlash culture.</p>`,
  "Tragedy as a lesson":`<p>"My wife died. Here's what it taught me about B2B sales" is a real-world title that satirists and sincere posters have both written — the genre is past Poe's law.</p>`,
  "Hustle culture":`<p>4:30am, cold plunge, honeymoon spent working. Hustle content was rewarded for years; 2025 commentary describes an "authenticity shift" as burnout and quiet-quitting pushed back.</p>`,
  "Hired-on-the-spot":`<p>A staple of r/LinkedInLunatics: a candidate is late / brings a kid / cries, and is hired instantly for "grit." Follow-ups rarely mention retention.</p>`,
  "Toddler KPI":`<p>Child says something; poster discovers a sales funnel. The gold Top Voice badge next to this name was handed out automatically for AI-answering AI-generated "collaborative articles" — 10M+ contributions before LinkedIn retired the badge in October 2024 as a participation trophy.</p>`,
  "Engagement bait":`<p>"Agree?", "comment PLAYBOOK", "repost if you agree." Vendor data claims the 2026 "authenticity update" cuts reach for these by ~40%, after years of rewarding them.</p>`,
  "Open to Work discourse":`<p>220M people use the green frame. A Hung Lee poll of recruiters: 70% say it helps, 7% say it hurts — but an ex-Google recruiter called it "the biggest red flag on LinkedIn," and the argument itself is now an evergreen reach farm.</p>`,
  "Lead-magnet gate":`<p>The course is the secret. "Link in comments" exists because external links are believed to cut reach 40–60% — a belief a 2026 study of 400k posts contradicts, which hasn't stopped anyone.</p>`,
  "Poll":`<p>Polls once got a reach multiplier, were abused as bait, then reportedly lost ~60% of reach. The options are still obvious. Vote to see results that were decided in advance.</p>`,
  "Sponsored":`<p>Premium revenue passed $1.7B in FY2024, credited to AI features — including the ones that generate the content the feed classifier now demotes.</p>`,
  "Proposal":`<p>A 2023 proposal-as-B2B-lesson post was "torn to shreds" and became a subreddit classic. Weddings, births, and funerals all convert to pipeline.</p>`,
  "Uber driver":`<p>The service-worker oracle: an Uber driver, barista, or janitor delivers a one-line aphorism that justifies the poster's existing strategy. Nobody has ever met the driver.</p>`,
  "Repost":`<p>Reposting without comment is the lowest-effort engagement and is treated as such: the algorithm prefers original posts, so your 500+ connections mostly won't see it.</p>`,
};
function expand(id){const p=S.posts.find(p=>p.id===id);p.expanded=true;bump({burn:1});render();toast('Dwell time recorded. That click was the entire point of the formatting.')}
function reactBar(id){const a=$('#act-'+id);if(!a||a.querySelector('.reacts'))return;const r=document.createElement('div');r.className='reacts';r.innerHTML=['👍','👏','❤️','💡','😂','🫠'].map(e=>`<button onclick="react('${id}','${e}');event.stopPropagation()">${e}</button>`).join('');a.appendChild(r);a.addEventListener('mouseleave',()=>r.remove(),{once:true})}
function react(id,emoji,comment){
  const p=S.posts.find(p=>p.id===id);p.reacted=emoji||p.reacted||'👍';p.likes++;
  const who=rnd(PEOPLE);p.comments.push({who,text:rnd(AI_COMMENTS).replace('{n}',(p.mine?'You':p.who[0]).split(' ')[0])});
  if(comment)p.comments.push({who:YOU,text:rnd(AI_COMMENTS).replace('{n}',p.who[0].split(' ')[0])});
  bump({clout:1,burn:1,dig:-1});unlock('first_like');render();addNotif(`${who[0]} also commented on a post you ${comment?'commented on':'reacted to'}. Reply to keep the conversation meaningful!`);
  toast(emoji==='🫠'?'🫠 is not an official reaction. It has been recorded as "Insightful".':comment?'We drafted your comment for you. It restates the post. Everyone\'s does.':'Reacted. An AI-suggested comment has been added on your behalf.');}
function vote(id){const p=S.posts.find(p=>p.id===id);p.voted=true;bump({dig:-1});render();toast('Vote counted. Results were decided in advance. Reach of this poll: −60%.')}
function repost(id){const p=S.posts.find(p=>p.id===id);const r=mkPost({genre:'Repost',text:`Reposting this because it resonated. 🙌\n\n— — —\n\n${p.t.text}`,srcs:['vdb']});r.mine=true;r.likes=1;S.posts.unshift(r);bump({clout:1,dig:-3});render();toast('Reposted to 500+ people who will not see it.')}
function share(id){modal(`<h2>Send post</h2><p class="muted">Choose a connection to annoy.</p><div class="stack" style="margin-top:8px">${PEOPLE.slice(0,4).map(p=>`<button class="btn sm" style="justify-content:flex-start" onclick="closeModal();toast('Sent to ${esc(p[0].split(' ')[0])}. Seen. No reply. A pitch is incoming.');bump({dig:-1});setTimeout(()=>addThread(PEOPLE[${pidx(p)}]),1500)">${esc(p[0])}</button>`).join('')}<button class="btn ghost sm" onclick="closeModal();toast('Copied link. Nobody will click it; it\\'s external.')">Copy link</button></div>`)}
function whoLiked(id){const p=S.posts.find(p=>p.id===id);modal(`<h2>Reactions</h2><p class="muted">${p.likes.toLocaleString()} reactions. Showing 5. The rest are Premium.</p><div class="stack" style="margin-top:8px">${PEOPLE.slice(0,5).map(p=>`<div class="row">${avatar(p,'sm')}<div><b>${esc(p[0])}</b><div class="tiny">${esc(p[1]).slice(0,40)}…</div></div><span class="tiny" style="margin-left:auto">${rnd(['👍','👏','💡','❤️'])} bot</span></div>`).join('')}</div><button class="btn gold sm" style="margin-top:10px" onclick="closeModal();openPremium()">See all ${p.likes.toLocaleString()}</button>`)}
function kebab(id,ev){
  ev.stopPropagation();document.querySelectorAll('.menu').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=`<button onclick="slop('${id}')">🫠 Seems like AI slop</button><button onclick="toast('Hidden. It will return as a Promoted post.');bump({dig:1})">Hide post</button><button onclick="toast('Unfollowed. You still see them, via People also viewed.')">Unfollow</button><button onclick="toast('Saved to a folder you will never open.')">Save</button><button onclick="toast('Reported. Our classifier is 94% accurate. This post was the other 6%.')">Report</button><button onclick="copyPost('${id}')">Copy text as my own</button>`;
  ev.target.closest('.head').appendChild(m);setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}));}
function copyPost(id){const p=S.posts.find(p=>p.id===id);$('#draft').value=p.t.text;updReach();bump({dig:-10,clout:2});toast('Copied into your composer. Original thought is optional.');window.scrollTo({top:0,behavior:'smooth'})}
function slop(id){const p=S.posts.find(p=>p.id===id);p.suppressed=true;bump({dig:2});unlock('slop_reporter');render();toast('Thanks. This post has been suppressed, not removed. The author will not be told. Their "Rewrite with AI" subscription renews Tuesday.')}
function moreSlop(){for(let i=0;i<4;i++)S.posts.push(mkPost());bump({burn:3});render();toast('4 more posts. Statistically, 3.25 of them are AI.')}

let threads=null,openT=0;
function ensureThreads(){if(!threads){threads=[4,2,1,0,3,5].map((pi,i)=>({who:PEOPLE[pi],text:SPAM[i%SPAM.length]('Sundeep'),unread:i<3,replies:[]}))}}

/* Qeens: 5x5, regions, one crown per row/col/region, no touching */
const QREG=[[0,0,1,1,1],[0,0,1,2,1],[3,0,2,2,2],[3,3,3,4,2],[3,4,4,4,4]];
const QCOL=['#f7c59f','#a8dadc','#c7e9b0','#e0bbe4','#ffe08a'];
let qb=Array(25).fill(0);
function qHTML(){return QREG.flat().map((r,i)=>`<button style="background:${QCOL[r]}" onclick="qTap(${i})" aria-label="cell ${i}">${qb[i]===1?'✕':qb[i]===2?'👑':''}</button>`).join('')}
function qTap(i){qb[i]=(qb[i]+1)%3;$('#qgrid').innerHTML=qHTML();qCheck()}
function qCheck(){const crowns=qb.map((v,i)=>v===2?i:-1).filter(i=>i>=0);const rows=new Set(),cols=new Set(),regs=new Set();let ok=true;
  crowns.forEach(i=>{const r=i/5|0,c=i%5;if(rows.has(r)||cols.has(c)||regs.has(QREG[r][c]))ok=false;rows.add(r);cols.add(c);regs.add(QREG[r][c]);
    crowns.forEach(j=>{if(j!==i&&Math.abs((j/5|0)-r)<=1&&Math.abs(j%5-c)<=1)ok=false})});
  const s=$('#qstat');if(crowns.length===5&&ok){s.textContent='👑 Solved! Your time has been shared with your manager.';unlock('qeens');bump({clout:3,burn:-5})}else s.textContent=ok?`${crowns.length}/5 crowns placed.`:'Conflict: crowns can\'t share a row, column, colour, or touch.'}

function bingoT(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const cells=[...document.querySelectorAll('.bingo button')].map(x=>x.getAttribute('aria-pressed')==='true');const n=cells.filter(Boolean).length;

function cancel3(){modal(`<h2>Tell us why you're leaving</h2><div class="stack" style="margin-top:8px">${['Too expensive','Didn\'t get a job','Top Applicant meant nothing','I found the Cancel button on my own','Dignity'].map(r=>`<label class="row"><input type="radio" name="why"> ${r}</label>`).join('')}</div><div class="row" style="margin-top:12px;flex-wrap:wrap;justify-content:space-between"><button class="btn gold" onclick="closeModal();toast('Feedback saved. Subscription kept.')">Submit feedback</button><button class="decline" style="margin:0" onclick="cancel4()">cancel subscription</button></div>`)}
function cancel4(){const bs=['Keep Premium','Keep Premium','Cancel','Keep Premium'].sort(()=>Math.random()-.5);modal(`<h2>Confirm</h2><p class="muted">One of these cancels. They all look the same.</p><div class="row" style="margin-top:10px;flex-wrap:wrap">${bs.map(b=>`<button class="btn gold" onclick="${b==='Cancel'?'cancelDone()':"closeModal();toast('Kept! See you at renewal.')"}">${b}</button>`).join('')}</div>`)}
function cancelDone(){trial=false;closeModal();unlock('cancelled');bump({dig:10});render();toast('Cancelled. A win-back email is already in your inbox.')}
function openPremium(t,b){modal(`<span class="pill gold">PREMIUM</span><h2 style="margin-top:6px">${esc(t||'Someone at a Fortune 500 company viewed your profile.')}</h2><p class="muted">${esc(b||'Unlock Premium to see who. (It was a recruiter\'s automated search. It counts as a view.)')}</p>
  <div class="blur-row">${PEOPLE.slice(0,5).map(p=>`<div class="avatar sm" style="background:${p[2]};cursor:default">${p[0][0]}</div>`).join('')}</div>
  <button class="btn gold" onclick="startTrial()">Start your free 1-month trial</button>
  <div class="price">Then $39.99/mo. Price shown after you've entered a card. Cancel via a flow where the buttons swap places.</div>
  <br><button class="decline" onclick="closeModal();bump({dig:1})">No thanks, I prefer not to be a Top Applicant</button>`)}
function startTrial(){trial=true;closeModal();unlock('premium');bump({clout:5,dig:-8});toast('Trial started. Nothing was charged because nothing here is real. Now try to cancel it (Premium tab).');addNotif('Welcome to Premium! You are now a Top Applicant (top 50%) for 1,000+ jobs.');if(S.view==='premium')render()}

/* ───────────────────────── modal / misc ───────────────────────── */
function modal(html){$('#modal').innerHTML=`<button class="x" onclick="closeModal()" aria-label="Close">✕</button>${html}`;$('#modalbg').classList.add('show')}
function closeModal(){$('#modalbg').classList.remove('show')}
$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePop()}});

function afterRender(){
  document.querySelectorAll('.live').forEach(el=>{let n=+el.dataset.n;if(n>=1000)return;el._iv=setInterval(()=>{if(!document.body.contains(el)){clearInterval(el._iv);return}n+=Math.floor(Math.random()*3)+1;el.textContent=n>=1000?'1,000+':n;if(n>=1000)clearInterval(el._iv)},900+Math.random()*1500)});
  const a=$('#appsMin');if(a){let n=11000;a._iv=setInterval(()=>{if(!document.body.contains(a)){clearInterval(a._iv);return}n+=Math.floor(Math.random()*40)+10;a.textContent=n.toLocaleString()},500)}
}
